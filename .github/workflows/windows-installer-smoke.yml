name: Windows installer smoke test
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v0.1.3
permissions:
  contents: read
jobs:
  clean-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify installer
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          $downloadDir = Join-Path $env:RUNNER_TEMP 'callnotes-download'
          New-Item -ItemType Directory -Force $downloadDir | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern '*Windows-x64.exe' --pattern 'SHA256SUMS.txt' --dir $downloadDir
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $expected = (Get-Content (Join-Path $downloadDir 'SHA256SUMS.txt') -Raw).Trim() -split '\s+', 2
          $installerFile = Join-Path $downloadDir $expected[1]
          if ((Get-FileHash -LiteralPath $installerFile -Algorithm SHA256).Hash.ToLower() -ne $expected[0]) { throw 'Installer checksum mismatch' }
          $installDir = Join-Path $env:RUNNER_TEMP 'CallNotes Installed'
          $setupProcess = Start-Process -FilePath $installerFile -ArgumentList '--test-install',('"'+$installDir+'"') -WindowStyle Hidden -Wait -PassThru
          if ($setupProcess.ExitCode -ne 0) { throw "Installer failed: $($setupProcess.ExitCode)" }
      - name: Run installed UI, media import and CPU speech recognition
        shell: pwsh
        run: |
          python packaging/verify_windows.py --app "$env:RUNNER_TEMP\CallNotes Installed" --out "$env:RUNNER_TEMP\callnotes-verification" --speech tests/fixtures/meeting-en.wav
          if ($LASTEXITCODE -ne 0) { throw 'Installed application verification failed' }
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-verification
          path: |
            ${{ runner.temp }}/callnotes-verification/verification.json
            ${{ runner.temp }}/callnotes-verification/ui-*.json
            ${{ runner.temp }}/callnotes-verification/ui-*.png
          if-no-files-found: warn
          retention-days: 7
